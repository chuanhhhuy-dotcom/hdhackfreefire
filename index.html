<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Hacker Terminal</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html, body {
  width:100%; height:100%;
  background:#000;
  color:#0f0;
  font-family:'Consolas','Courier New',monospace;
  overflow:hidden;
  user-select:none;
}
#terminal {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  padding:15px;
  font-size:14px;
  line-height:1.5;
  overflow-y:auto;
}
#terminal::-webkit-scrollbar { width:6px; }
#terminal::-webkit-scrollbar-thumb { background:#0f0; border-radius:3px; }
.line { white-space:pre-wrap; word-break:break-all; }
.green { color:#0f0; }
.red { color:#f00; }
.yellow { color:#ff0; }
.cyan { color:#0ff; }
.magenta { color:#f0f; }
.white { color:#fff; }
#input-line {
  display:flex;
  align-items:center;
  margin-top:5px;
}
#prompt { color:#0f0; margin-right:8px; }
#cmd-input {
  background:transparent;
  border:none;
  outline:none;
  color:#0f0;
  font-family:'Consolas',monospace;
  font-size:14px;
  flex:1;
  caret-color:#0f0;
}
#top-bar {
  position:fixed;
  top:0; left:0;
  width:100%;
  background:rgba(0,0,0,0.9);
  border-bottom:1px solid #0f0;
  padding:5px 15px;
  font-size:11px;
  color:#0f0;
  display:flex;
  justify-content:space-between;
  z-index:100;
}
#top-bar span { opacity:0.7; }
.blink { animation:blink 1s infinite; }
@keyframes blink {
  0%,100% { opacity:1; }
  50% { opacity:0; }
}
#cursor-block {
  display:inline-block;
  width:8px;
  height:14px;
  background:#0f0;
  animation:blink 0.8s infinite;
  vertical-align:middle;
  margin-left:2px;
}
#scanlines {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
  background:repeating-linear-gradient(
    0deg,
    rgba(0,255,0,0.03) 0px,
    rgba(0,255,0,0.03) 1px,
    transparent 1px,
    transparent 3px
  );
  z-index:50;
}
#vignette {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
  background:radial-gradient(ellipse at center, transparent 0%, transparent 60%, rgba(0,0,0,0.7) 100%);
  z-index:51;
}
#matrix-canvas {
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  opacity:0.15;
  z-index:0;
}
#terminal-content {
  position:relative;
  z-index:10;
  padding-top:30px;
}
</style>
</head>
<body>
<canvas id="matrix-canvas"></canvas>
<div id="scanlines"></div>
<div id="vignette"></div>

<div id="top-bar">
  <span>root@anhhuy:~#</span>
  <span id="clock">--:--:--</span>
  <span>SECURE SHELL</span>
</div>

<div id="terminal">
  <div id="terminal-content"></div>
</div>

<script>
// ====== MATRIX BACKGROUND ======
const canvas = document.getElementById('matrix-canvas');
const ctx = canvas.getContext('2d');
function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const chars = '01アイウエオカキクケコサシスセソタチツテトナニヌネノハヒフヘホABCDEFGHIJKLMNOPQRSTUVWXYZ';
const fontSize = 14;
let columns = Math.floor(canvas.width / fontSize);
let drops = Array(columns).fill(1);

function drawMatrix() {
  ctx.fillStyle = 'rgba(0,0,0,0.05)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#0f0';
  ctx.font = fontSize + 'px monospace';
  for (let i = 0; i < drops.length; i++) {
    const text = chars[Math.floor(Math.random() * chars.length)];
    ctx.fillText(text, i * fontSize, drops[i] * fontSize);
    if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
      drops[i] = 0;
    }
    drops[i]++;
  }
}
setInterval(drawMatrix, 50);

// ====== CLOCK ======
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent = now.toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

// ====== TERMINAL ======
const content = document.getElementById('terminal-content');
const terminal = document.getElementById('terminal');

function addLine(text, className = 'green') {
  const div = document.createElement('div');
  div.className = 'line ' + className;
  div.textContent = text;
  content.appendChild(div);
  terminal.scrollTop = terminal.scrollHeight;
}

function addInputLine() {
  const div = document.createElement('div');
  div.id = 'input-line';
  div.innerHTML = '<span id="prompt">root@anhhuy:~# </span><input id="cmd-input" type="text" autocomplete="off" spellcheck="false" autofocus><span id="cursor-block"></span>';
  content.appendChild(div);
  const input = document.getElementById('cmd-input');
  input.focus();
  input.addEventListener('keydown', handleCommand);
  // Focus lại khi click bất kỳ đâu
  document.addEventListener('click', () => input.focus());
}

// ====== COMMANDS ======
const commands = {
  help: () => {
    addLine('Danh sách lệnh khả dụng:', 'cyan');
    addLine('  help          - Hiển thị trợ giúp', 'green');
    addLine('  whoami        - Thông tin người dùng', 'green');
    addLine('  scan          - Quét mạng', 'green');
    addLine('  hack [target] - Tấn công mục tiêu', 'green');
    addLine('  matrix        - Bật hiệu ứng matrix', 'green');
    addLine('  clear         - Xóa màn hình', 'green');
    addLine('  exit          - Thoát', 'green');
  },
  whoami: () => {
    addLine('root', 'yellow');
    addLine('UID: 0 (root)', 'gray');
    addLine('Groups: root, wheel, sudo', 'gray');
  },
  scan: () => {
    addLine('Đang quét mạng...', 'cyan');
    let i = 0;
    const ips = ['192.168.1.1', '192.168.1.2', '192.168.1.5', '192.168.1.8', '10.0.0.1', '10.0.0.15'];
    const interval = setInterval(() => {
      if (i >= ips.length) {
        clearInterval(interval);
        addLine('[+] Tìm thấy ' + ips.length + ' thiết bị trong mạng.', 'yellow');
        return;
      }
      addLine('  -> ' + ips[i] + '  OPEN  22/tcp, 80/tcp, 443/tcp', 'green');
      i++;
    }, 300);
  },
  hack: (args) => {
    const target = args[0] || 'localhost';
    addLine('[*] Bắt đầu tấn công ' + target, 'yellow');
    addLine('[*] Đang quét cổng...', 'cyan');
    const steps = [
      '  Port 22/tcp   open  ssh',
      '  Port 80/tcp   open  http',
      '  Port 443/tcp  open  https',
      '  Port 3306/tcp open  mysql',
      '[+] Tìm thấy lỗ hổng SQL Injection!',
      '[*] Đang khai thác...',
      '[*] Bypass authentication...',
      '[+] Đăng nhập thành công!',
      '[+] Đang dump database...',
      '[+] Lấy được 1523 bản ghi.',
      '[+] Leo thang đặc quyền...',
      '[+] ROOT ACCESS GRANTED!',
      '[*] Cài đặt backdoor...',
      '[+] Hoàn tất. Hệ thống đã bị xâm nhập.',
    ];
    let i = 0;
    const interval = setInterval(() => {
      if (i >= steps.length) {
        clearInterval(interval);
        addLine('', 'green');
        addLine('╔══════════════════════════════════════╗', 'red');
        addLine('║   HỆ THỐNG ĐÃ BỊ XÂM NHẬP THÀNH CÔNG  ║', 'red');
        addLine('╚══════════════════════════════════════╝', 'red');
        return;
      }
      addLine(steps[i], i < 4 ? 'green' : (i < 8 ? 'yellow' : 'cyan'));
      i++;
    }, 400);
  },
  matrix: () => {
    addLine('Matrix mode activated.', 'green');
    canvas.style.opacity = '0.4';
    setTimeout(() => canvas.style.opacity = '0.15', 3000);
  },
  clear: () => {
    content.innerHTML = '';
    addInputLine();
  },
  exit: () => {
    addLine('Đang thoát...', 'yellow');
    setTimeout(() => {
      document.body.style.background = '#000';
      content.innerHTML = '';
      addLine('Connection closed.', 'red');
    }, 500);
  }
};

function handleCommand(e) {
  if (e.key === 'Enter') {
    const input = e.target;
    const cmd = input.value.trim();
    if (!cmd) return;
    // Hiển thị lệnh đã gõ
    addLine('root@anhhuy:~# ' + cmd, 'white');
    // Xóa input line cũ
    const oldLine = document.getElementById('input-line');
    if (oldLine) oldLine.remove();
    // Xử lý lệnh
    const parts = cmd.split(' ');
    const mainCmd = parts[0].toLowerCase();
    const args = parts.slice(1);
    if (commands[mainCmd]) {
      commands[mainCmd](args);
    } else {
      addLine('bash: ' + mainCmd + ': command not found', 'red');
    }
    // Thêm input line mới
    setTimeout(addInputLine, 50);
  }
}

// ====== KHỞI ĐỘNG ======
addLine('Secure Shell (SSH) - AnhHuy Terminal v2.0', 'cyan');
addLine('Copyright (c) 2026 AnhHuy Dev. All rights reserved.', 'gray');
addLine('', 'green');
addLine('Kết nối đến máy chủ từ xa...', 'yellow');
setTimeout(() => {
  addLine('[+] Kết nối thành công.', 'green');
  addLine('[+] Đã xác thực. Chào mừng root.', 'green');
  addLine('', 'green');
  addLine('Gõ "help" để xem danh sách lệnh.', 'cyan');
  addLine('', 'green');
  addInputLine();
}, 800);
</script>
</body>
</html>
